defaults: ./vlm_grpo-nemotron-omni-30ba3b-mmpr-4n8g-megatron-tp8ep16.v1.yaml
loss_fn:
  use_importance_sampling_correction: true
checkpointing:
  checkpoint_dir: results/vlm_grpo_nemotron_omni_mmpr_megatron_topp0.9_topk50_is
policy:
  generation:
    top_p: 0.9
    top_k: 50
    vllm_cfg:
      # The Omni chain inherits raw_logprobs (parity with the unfiltered policy
      # recomputation under bad_words). With top-k/top-p the policy filters its
      # logprobs, so raw vLLM logprobs are a different quantity; compare like with like.
      logprobs_mode: processed_logprobs
logger:
  wandb:
    name: nemotron-omni-mmpr-megatron-topp0.9-topk50-is
